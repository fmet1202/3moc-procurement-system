{% extends "admin/base_admin.html" %}
{% block admin_content %}

<div class="dashboard-header" style="margin-bottom: 24px;">
  <h1>Change Admin Password</h1>
  <a href="{{ url_for('admin.dashboard') }}" class="btn-sm" style="color: #135334; font-weight:700; text-decoration:none;">← Back to Dashboard</a>
</div>

<div class="card-box" style="max-width: 480px;">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-group" style="margin-bottom: 16px;">
      <label style="display:block; font-size:0.85rem; font-weight:700; margin-bottom:6px;">Current Password</label>
      <input type="password" name="current_password" class="cell-input" required autocomplete="current-password" style="width:100%;">
    </div>

    <div class="form-group" style="margin-bottom: 16px;">
      <label style="display:block; font-size:0.85rem; font-weight:700; margin-bottom:6px;">New Password (Min. 10 characters)</label>
      <input type="password" name="new_password" class="cell-input" required minlength="10" autocomplete="new-password" style="width:100%;">
    </div>

    <div class="form-group" style="margin-bottom: 20px;">
      <label style="display:block; font-size:0.85rem; font-weight:700; margin-bottom:6px;">Confirm New Password</label>
      <input type="password" name="confirm_password" class="cell-input" required minlength="10" autocomplete="new-password" style="width:100%;">
    </div>

    <button type="submit" class="btn-primary-add" style="width:100%; justify-content:center;">Update Password</button>
  </form>
</div>

{% endblock %}
